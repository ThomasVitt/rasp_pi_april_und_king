---
- name: Home Assistant (Docker) und WireGuard auf Raspberry Pi OS Lite
  hosts: raspi
  connection: local
  become: true

  tasks:
    # ---------- Basis ----------
    - name: Zeitzone setzen
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Apt-Cache aktualisieren und System upgraden
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Benötigte Pakete installieren
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - apparmor
          - libcap2-bin
          - wireguard
          - wireguard-tools
          - iputils-ping
          - bluez                 # Host-Bluetooth-Stack, von HA ueber DBus genutzt
          - dbus
          - rfkill
          - python3-docker
        state: present

    # ---------- Docker ----------
    - name: Docker-GPG-Key ablegen
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Docker-Repository hinzufügen
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'armhf' }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/debian
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Docker installieren
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Docker aktivieren und starten
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Benutzer zur docker-Gruppe hinzufügen
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    # ---------- Bluetooth (Host) ----------
    - name: Bluetooth nicht per rfkill blockieren
      ansible.builtin.command: rfkill unblock bluetooth
      changed_when: false
      failed_when: false

    - name: DBus und Bluetooth-Dienst aktivieren und starten
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - dbus
        - bluetooth

    # ---------- Home Assistant ----------
    - name: Config-Verzeichnis für Home Assistant anlegen
      ansible.builtin.file:
        path: "{{ ha_config_dir }}"
        state: directory
        mode: "0755"

    - name: Home Assistant Container starten
      community.docker.docker_container:
        name: homeassistant
        image: "{{ ha_image }}"
        pull: true
        state: started
        restart_policy: unless-stopped
        network_mode: host
        privileged: true          # nötig für USB-Sticks (Zigbee/Z-Wave)
        capabilities:             # Bluetooth: Raw-Zugriff auf HCI/Netzwerk-Adapter
          - NET_ADMIN
          - NET_RAW
        env:
          TZ: "{{ timezone }}"
        volumes:
          - "{{ ha_config_dir }}:/config"
          - /etc/localtime:/etc/localtime:ro
          - /run/dbus:/run/dbus:ro

    # ---------- WireGuard (Client -> vServer) ----------
    - name: WireGuard-Verzeichnis absichern
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        mode: "0700"

    - name: Pi-Private-Key generieren (nur falls nicht vorhanden)
      ansible.builtin.shell: umask 077 && wg genkey > /etc/wireguard/private.key
      args:
        creates: /etc/wireguard/private.key

    - name: Pi-Public-Key ableiten
      ansible.builtin.shell: wg pubkey < /etc/wireguard/private.key > /etc/wireguard/public.key
      args:
        creates: /etc/wireguard/public.key

    - name: Private Key einlesen
      ansible.builtin.slurp:
        src: /etc/wireguard/private.key
      register: wg_private_key_raw
      no_log: true

    - name: Public Key einlesen
      ansible.builtin.slurp:
        src: /etc/wireguard/public.key
      register: wg_public_key_raw

    - name: WireGuard-Konfiguration schreiben
      ansible.builtin.template:
        src: wg0.conf.j2
        dest: "/etc/wireguard/{{ wg_interface }}.conf"
        owner: root
        group: root
        mode: "0600"
      vars:
        wg_private_key: "{{ wg_private_key_raw.content | b64decode | trim }}"
      no_log: true
      notify: Restart WireGuard

    - name: Systemd-Drop-in-Verzeichnis anlegen
      ansible.builtin.file:
        path: "/etc/systemd/system/wg-quick@{{ wg_interface }}.service.d"
        state: directory
        mode: "0755"

    - name: Drop-in - erst nach Netzwerk starten, bei Fehler neu versuchen
      ansible.builtin.copy:
        dest: "/etc/systemd/system/wg-quick@{{ wg_interface }}.service.d/override.conf"
        mode: "0644"
        content: |
          [Unit]
          Wants=network-online.target
          After=network-online.target nss-lookup.target
          StartLimitIntervalSec=0

          [Service]
          Restart=on-failure
          RestartSec=15
      notify:
        - Reload systemd
        - Restart WireGuard

    - name: Watchdog-Skript installieren
      ansible.builtin.copy:
        dest: /usr/local/bin/wg-watchdog.sh
        mode: "0755"
        content: |
          #!/bin/sh
          # Prueft die Verbindung zum vServer; baut sie bei Ausfall neu auf.
          IF="{{ wg_interface }}"
          if ! ip link show "$IF" >/dev/null 2>&1; then
            systemctl restart "wg-quick@$IF"; exit 0
          fi
          if ! ping -c 2 -W 3 -I "$IF" {{ wg_server_tunnel_ip }} >/dev/null 2>&1; then
            logger -t wg-watchdog "vServer nicht erreichbar, starte $IF neu"
            systemctl restart "wg-quick@$IF"
          fi

    - name: Watchdog-Service anlegen
      ansible.builtin.copy:
        dest: /etc/systemd/system/wg-watchdog.service
        mode: "0644"
        content: |
          [Unit]
          Description=WireGuard Verbindungs-Watchdog
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/wg-watchdog.sh
      notify: Reload systemd

    - name: Watchdog-Timer anlegen (jede Minute)
      ansible.builtin.copy:
        dest: /etc/systemd/system/wg-watchdog.timer
        mode: "0644"
        content: |
          [Unit]
          Description=WireGuard Watchdog alle 60s

          [Timer]
          OnBootSec=2min
          OnUnitActiveSec=60s

          [Install]
          WantedBy=timers.target
      notify: Reload systemd

    - name: Systemd neu laden
      ansible.builtin.systemd:
        daemon_reload: true

    - name: WireGuard beim Booten aktivieren und starten
      ansible.builtin.service:
        name: "wg-quick@{{ wg_interface }}"
        state: started
        enabled: true

    - name: Watchdog-Timer aktivieren
      ansible.builtin.systemd:
        name: wg-watchdog.timer
        state: started
        enabled: true

    - name: Hinweise ausgeben
      ansible.builtin.debug:
        msg:
          - "Home Assistant: http://{{ ansible_default_ipv4.address }}:8123"
          - "Public Key des Pi (auf dem vServer als Peer eintragen): {{ wg_public_key_raw.content | b64decode | trim }}"
          - "vServer-Peer: AllowedIPs = {{ wg_address.split('/')[0] }}/32"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart WireGuard
      ansible.builtin.service:
        name: "wg-quick@{{ wg_interface }}"
        state: restarted
