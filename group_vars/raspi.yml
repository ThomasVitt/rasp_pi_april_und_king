---
timezone: Europe/Berlin

# Home Assistant
ha_config_dir: /opt/homeassistant/config
ha_image: ghcr.io/home-assistant/home-assistant:stable

# WireGuard (Pi baut Verbindung zum vServer auf)
wg_interface: wg0
wg_address: 10.8.0.5/24                 # Tunnel-IP des Pi
wg_server_endpoint: "vpn.tvitt.de:51820"   # oeffentliche IP/Domain + Port des vServers
wg_server_public_key: "fMQNQtg6YTVv0XrWU1TcCAU6CrnDPffxixWpfjDzNAk="
wg_server_tunnel_ip: 10.8.0.1           # Tunnel-IP des vServers (fuer den Watchdog-Ping)
# Nur Tunnel-Netz durch den VPN leiten. "0.0.0.0/0" wuerde den gesamten Traffic umleiten.
wg_allowed_ips: 10.8.0.0/24, 192.168.170.0/24

# Tunnel -> LAN (IP-Forwarding + NAT per iptables, wird in wg0.conf als PostUp/PostDown gesetzt)
wg_lan_forwarding: true
wg_lan_interface: eth0                  # Interface des Pi im LAN (eth0 oder wlan0)
wg_tunnel_network: 10.8.0.0/24          # Quelladressen, die ins LAN maskiert werden
